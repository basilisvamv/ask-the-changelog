<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Changelog</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#ffffff; --ink:#1b2233; --muted:#64708a; --line:#e6e9f2;
    --accent:#4263eb; --accent-ink:#ffffff; --accent-soft:#edf2ff;
    --high:#2f9e44; --high-soft:#ebfbee;
    --medium:#e67700; --medium-soft:#fff4e6;
    --low:#1971c2; --low-soft:#e7f5ff;
    --none:#868e96; --none-soft:#f1f3f5;
    --bad:#c92a2a; --bad-soft:#fff5f5;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
    --radius:14px;
  }
  [data-theme="dark"] {
    --bg:#0e1321; --card:#161d2f; --ink:#e7ebf5; --muted:#9aa5c1; --line:#263150;
    --accent:#748ffc; --accent-ink:#0e1321; --accent-soft:#1e2a4a;
    --high:#69db7c; --high-soft:#1b3326;
    --medium:#ffa94d; --medium-soft:#3a2a16;
    --low:#74c0fc; --low-soft:#16304a;
    --none:#adb5bd; --none-soft:#222a3b;
    --bad:#ff8787; --bad-soft:#3a1f25;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }

  /* Relevance levels: one colour per level, used everywhere in the app. */
  .lv-high { --lvl:var(--high); --lvl-soft:var(--high-soft); }
  .lv-medium { --lvl:var(--medium); --lvl-soft:var(--medium-soft); }
  .lv-low { --lvl:var(--low); --lvl-soft:var(--low-soft); }
  .lv-none { --lvl:var(--none); --lvl-soft:var(--none-soft); }

  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.45; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 20px 40px; }

  header.top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; padding:24px 0 4px; }
  .brand h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
  .brand p { margin:4px 0 0; color:var(--muted); font-size:14px; max-width:560px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }

  .block { margin-top:28px; }
  .sec-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .sec-head h2 { margin:0; font-size:18px; letter-spacing:-.01em; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  .empty { color:var(--muted); text-align:center; padding:22px; border:1px dashed var(--line); border-radius:var(--radius); grid-column:1 / -1; }

  button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--ink);
           border-radius:10px; padding:8px 14px; cursor:pointer; transition:border-color .15s, background .15s; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.ghost { background:transparent; }
  button:disabled { opacity:.5; cursor:default; }
  button:disabled:hover { border-color:var(--line); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted, .meta { font-size:13px; color:var(--muted); }
  .err { color:var(--bad); font-size:13px; }
  .eyebrow { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }

  /* Keywords */
  .group-title { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin:16px 0 8px; }
  .group-title:first-child { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border-radius:999px; padding:6px 12px; font-size:13px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .tag { font-size:12px; background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:2px 8px; }

  /* Level badge */
  .lvl { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; border-radius:999px;
         padding:3px 10px; white-space:nowrap; background:var(--lvl-soft); color:var(--lvl); }
  .lvl::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }

  /* Recommendation */
  .hero { border-radius:var(--radius); padding:24px; background:var(--lvl-soft); border:1px solid var(--line);
          border-left:6px solid var(--lvl); box-shadow:var(--shadow); }
  .hero h2 { margin:6px 0 10px; font-size:24px; letter-spacing:-.02em; }
  .hero .row { margin-top:10px; }
  .title-inline { font-weight:600; }
  .sub-title { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin:20px 0 10px; }
  .mini { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--lvl); border-radius:12px;
          padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; }
  .caveat { font-size:13px; color:var(--muted); margin:16px 0 0; }

  /* Companies */
  .company { display:flex; flex-direction:column; gap:6px; }
  .co-head { display:flex; align-items:center; gap:10px; }
  .co-name { font-size:16px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--none); flex:none; }
  .dot.ok { background:var(--high); }
  .dot.stale { background:var(--bad); }
  .stats { display:flex; gap:20px; margin:8px 0 4px; }
  .stat b { display:block; font-size:20px; letter-spacing:-.01em; }
  .stat span { font-size:12px; color:var(--muted); }
  .company .row { margin-top:auto; padding-top:10px; }
  .pill-info { font-size:13px; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:4px 12px; }

  /* Announcements */
  .ann { border-left:5px solid var(--lvl); display:flex; flex-direction:column; gap:8px; }
  .ann-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pill-co { font-size:12px; font-weight:600; color:var(--muted); background:var(--none-soft); border-radius:6px; padding:2px 8px; }
  .ann-title { margin:0; font-size:15px; line-height:1.35; }
  .ann-text { margin:0; font-size:14px; color:var(--muted); }
  .ann-actions { margin-top:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-top:4px; }
  .linkbtn { font-size:13px; color:var(--accent); text-decoration:none; padding:6px 10px; border-radius:8px; background:var(--accent-soft); }
  .explain { background:var(--bg); border-radius:10px; padding:10px 12px; font-size:14px; }
  .explain a { word-break:break-all; color:var(--accent); }

  /* Filters */
  .filters { display:grid; gap:10px; margin-bottom:16px; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; }
  .pill { border-radius:999px; padding:6px 14px; font-size:13px; }
  .pill.on { background:var(--ink); border-color:var(--ink); color:var(--bg); }

  /* Quick navigation: stays on screen while you scroll and shows the section you are in. */
  .jump { position:sticky; top:0; z-index:40; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
          padding:10px 0; margin-top:14px; background:var(--bg); }
  .jump a { font-size:13px; color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:999px;
            border:1px solid var(--line); background:var(--card); }
  .jump a:hover { color:var(--ink); border-color:var(--accent); }
  .jump a.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  [id^="sec-"] { scroll-margin-top:70px; }

  /* Toasts */
  #toasts { position:fixed; top:16px; right:16px; display:flex; flex-direction:column; gap:10px; z-index:50; max-width:360px; }
  .toast { background:var(--card); color:var(--ink); border:1px solid var(--line); border-left:5px solid var(--accent);
           box-shadow:0 10px 30px rgba(0,0,0,.18); border-radius:12px; padding:12px 14px; font-size:14px;
           cursor:pointer; white-space:pre-line; animation:slide-in .2s ease; }
  .toast.bad { border-left-color:var(--bad); }
  .toast.hi { border-left-color:var(--high); }
  @keyframes slide-in { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }

  @media (max-width:640px) {
    .wrap { padding:0 14px 32px; }
    .hero h2 { font-size:20px; }
    #toasts { left:14px; right:14px; max-width:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Ask the Changelog</h1>
      <p>Watches the changelogs of AI companies and scores each announcement against the keywords you choose.</p>
    </div>
    <div class="actions">
      <button id="notifyBtn">Enable notifications</button>
      <button id="theme" class="ghost">Dark theme</button>
    </div>
  </header>

  <nav class="jump" aria-label="Page sections">
    <a href="#sec-reco">Recommendation</a>
    <a href="#sec-keys">Keywords</a>
    <a href="#sec-companies">Companies</a>
    <a href="#sec-new">New</a>
    <a href="#sec-all">All</a>
    <a href="#">Top</a>
  </nav>

  <div id="toasts"></div>

  <section class="block">
    <div class="sec-head"><h2 id="sec-reco">Recommendation</h2></div>
    <div id="reco"></div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 id="sec-keys">Your keywords</h2><span id="count" class="meta"></span></div>
    <div class="card">
      <div id="chips"></div>
      <div class="row" style="margin-top:16px">
        <button id="save" class="primary">Save</button>
        <button id="clear">Clear</button>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 id="sec-companies">Companies</h2><div class="row"><span id="auto" class="pill-info" hidden></span><span id="credits" class="pill-info" hidden></span></div></div>
    <div id="companies" class="cards"></div>
    <div class="row" style="margin-top:14px">
      <button id="checkAll" class="primary">Check all</button>
      <button id="reload">Refresh list</button>
    </div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 id="sec-new">New announcements</h2><span class="meta">Best matches first</span></div>
    <div id="changes"></div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 id="sec-all">All announcements</h2></div>
    <div class="filters">
      <div id="levelFilters" class="pills"></div>
      <div id="companyFilters" class="pills"></div>
    </div>
    <div id="compare"></div>
  </section>
</div>

<script>
const LEVEL_LABEL = { high: 'High', medium: 'Medium', low: 'Low', none: 'None' };
const STATUS_LABEL = { ok: 'Working', stale: 'Last attempt failed', new: 'Not checked yet' };

// Keyword groups. Any keyword not listed here goes to "Other" automatically.
const GROUPS = [
  ['Languages and tools', ['HTML', 'CSS', 'JavaScript', 'Python', 'Node.js', 'Code']],
  ['Announcement type', ['Text', 'Voice', 'Images', 'Video', 'Games', 'Agents', 'Search']],
  ['Other', ['Pricing', 'Fast', 'API removals']],
];

// Keyword ids are already English labels, so they are shown as they are.
const tagLabel = (t) => t;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (iso) => (iso ? new Date(iso).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' }) : '—');
const fmtNum = (n) => (n == null ? '—' : Number(n).toLocaleString('en-US'));
const badge = (level) => `<span class="lvl lv-${esc(level)}">${LEVEL_LABEL[level] ?? esc(level)}</span>`;
const tagsHtml = (list) => (list ?? []).map((t) => `<span class="tag">${esc(tagLabel(t))}</span>`).join('');
const sourceLink = (url) => (url ? `<a class="linkbtn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Source</a>` : '');
const emptyBox = (text) => `<div class="empty">${esc(text)}</div>`;

function toast(text, { bad = false, hi = false, ms = 6000 } = {}) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '') + (hi ? ' hi' : '');
  el.textContent = text;
  el.addEventListener('click', () => el.remove());
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

async function api(path, options = {}) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Error ${res.status}`);
  return body;
}
const post = (path, data) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data ?? {}) });

// ---------- Theme ----------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? 'Light theme' : 'Dark theme';
}
let theme = 'light';
try { theme = localStorage.getItem('cr-theme') || 'light'; } catch { /* storage not available */ }
applyTheme(theme);
$('theme').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(theme);
  try { localStorage.setItem('cr-theme', theme); } catch { /* storage not available */ }
});

// ---------- Keywords ----------
let suggestions = [];
let selected = new Set();

function groupedTags() {
  const used = new Set();
  const out = GROUPS.map(([title, list]) => {
    const tags = list.filter((t) => suggestions.includes(t));
    tags.forEach((t) => used.add(t));
    return [title, tags];
  });
  const rest = suggestions.filter((t) => !used.has(t));
  if (rest.length) out.push(['Other', rest]);
  return out.filter(([, tags]) => tags.length);
}

function renderChips() {
  $('chips').innerHTML = groupedTags().map(([title, tags]) => `
    <div class="group-title">${esc(title)}</div>
    <div class="chips">${tags.map((t) => `<button class="chip${selected.has(t) ? ' on' : ''}" data-tag="${esc(t)}" aria-pressed="${selected.has(t)}">${esc(tagLabel(t))}</button>`).join('')}</div>`).join('');
  $('count').textContent = `${selected.size} of ${suggestions.length} selected`;
}

async function loadProfile() {
  const p = await api('/api/profile');
  suggestions = p.suggestions;
  selected = new Set(p.tags);
  renderChips();
}

$('chips').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-tag]');
  if (!btn) return;
  const t = btn.dataset.tag;
  if (selected.has(t)) selected.delete(t);
  else if (selected.size < 16) selected.add(t);
  else toast('Maximum 16 keywords.', { bad: true });
  renderChips();
});

$('clear').addEventListener('click', () => { selected = new Set(); renderChips(); });

$('save').addEventListener('click', async () => {
  try {
    const r = await post('/api/profile', { tags: [...selected] });
    selected = new Set(r.tags);
    renderChips();
    toast('Keywords saved. The recommendation and ranking are updated.\nNew announcements will be scored with the new keywords at the next check.', { ms: 8000 });
    await loadCompat();
  } catch (e) { toast(e.message, { bad: true }); }
});

// ---------- Recommendation ----------
function explainHtml(a) {
  const src = (a.sources ?? []).map((s) => (typeof s === 'string' ? s : s?.url)).filter((u) => /^https?:\/\//.test(u || ''));
  return `<div class="explain">${a.relevance ? badge(a.relevance) + ' ' : ''}${esc(a.explanation ?? 'No explanation.')}${src.length
    ? `<div class="meta" style="margin-top:6px">Sources: ${src.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`).join(', ')}</div>`
    : ''}</div>`;
}

function renderReco(d) {
  if (!d.tags.length) {
    $('reco').innerHTML = `
      <div class="hero lv-none">
        <div class="eyebrow">Best match for you</div>
        <h2>Pick some keywords</h2>
        <p class="muted" style="margin:0">Choose keywords in the Your keywords section and press Save to see which company matches best.</p>
      </div>`;
    return;
  }
  const rec = d.recommendation;
  if (!rec.length) {
    $('reco').innerHTML = emptyBox('No announcements yet. Check a company first.');
    return;
  }

  // Shows the buttons "Explain" and "Source" on the recommendation cards, as in the list.
  // "Explain" uses the same index as the list, so it finds the same announcement.
  const actions = (r) => {
    const i = d.items.findIndex((p) => p.companyId === r.companyId && p.title === r.title && p.date === r.date);
    if (i < 0) return '';
    return `<div class="ann-actions"><button data-explain="${i}" data-box="ex-r-${i}">Explain</button>${sourceLink(r.url)}</div><div id="ex-r-${i}"></div>`;
  };

  const top = rec[0];
  const headline = top.ratio > 0
    ? `The best match is ${esc(top.company)}`
    : 'No announcement matches your keywords';
  const hero = `
    <div class="hero lv-${esc(top.level)}">
      <div class="eyebrow">Best match for you</div>
      <h2>${headline}</h2>
      <div class="row">${badge(top.level)} <span class="title-inline">${esc(top.title)}</span></div>
      <div class="chips" style="margin-top:12px">${tagsHtml(top.matched)}</div>
      <div class="meta" style="margin-top:10px">${esc(top.date ?? '')}</div>
      ${actions(top)}
    </div>`;
  const others = rec.slice(1).map((r) => `
    <div class="mini lv-${esc(r.level)}">
      <div class="meta">${esc(r.company)}</div>
      <div>${badge(r.level)}</div>
      <div class="title-inline">${esc(r.title)}</div>
      <div class="chips">${r.matched.length ? tagsHtml(r.matched) : '<span class="meta">No keyword matches</span>'}</div>
      ${actions(r)}
    </div>`).join('');
  $('reco').innerHTML = hero
    + (others ? `<div class="sub-title">Other companies</div><div class="cards">${others}</div>` : '')
    + `<p class="caveat">This recommendation is based only on the keywords you chose. It is not an objective judgment of which AI is better, and it does not count how many announcements each company has.</p>`;
}

// ---------- Companies ----------
function summarizeCheck(r) {
  if (r.warning) return r.warning;
  if (r.baseline) return 'First check: the starting state was saved.';
  const n = r.changes?.length ?? 0;
  return n ? `${n} new announcements found.` : 'No new announcements.';
}

async function loadCompanies() {
  const list = await api('/api/companies');
  const st = await api('/api/status');

  $('auto').hidden = false;
  $('auto').textContent = st.autoCheckMinutes > 0
    ? `Automatic check every ${st.autoCheckMinutes} minutes` + (st.lastAutoRun ? ` · last ${when(st.lastAutoRun)}` : '')
    : 'Automatic checks are off';

  // Credits left, from the most recent check.
  const latest = list
    .filter((c) => c.credits?.remaining != null)
    .sort((a, b) => String(b.checkedAt).localeCompare(String(a.checkedAt)))[0];
  if (latest) {
    $('credits').hidden = false;
    $('credits').textContent = `Balance: ${fmtNum(latest.credits.remaining)} credits`;
  } else {
    $('credits').hidden = true;
  }

  $('companies').innerHTML = list.length
    ? list.map((c) => `
      <article class="card company">
        <div class="co-head"><span class="dot ${esc(c.status)}"></span><strong class="co-name">${esc(c.name)}</strong></div>
        <div class="meta">${esc(STATUS_LABEL[c.status] ?? c.status)}</div>
        <div class="stats">
          <div class="stat"><b>${c.planCount}</b><span>announcements</span></div>
          <div class="stat"><b>${fmtNum(c.credits?.consumed)}</b><span>credits in last check</span></div>
        </div>
        <div class="meta">Last check: ${when(c.checkedAt)}</div>
        ${c.error ? `<div class="err">${esc(c.error)}</div>` : ''}
        <div class="row"><button class="primary" data-id="${esc(c.id)}">Check now</button></div>
      </article>`).join('')
    : emptyBox('No companies with a URL.');
}

$('companies').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-id]');
  if (!btn) return;
  btn.disabled = true;
  try {
    const r = await post(`/api/refresh/${encodeURIComponent(btn.dataset.id)}?force=1`);
    toast(summarizeCheck(r));
  } catch (err) { toast(err.message, { bad: true }); }
  btn.disabled = false;
  await refreshAll().catch(() => {});
});

$('checkAll').addEventListener('click', async () => {
  const btns = [...document.querySelectorAll('#companies [data-id]')];
  const lines = [];
  $('checkAll').disabled = true;
  for (const b of btns) {
    try {
      const r = await post(`/api/refresh/${encodeURIComponent(b.dataset.id)}?force=1`);
      lines.push(`${b.dataset.id}: ${summarizeCheck(r)}`);
    } catch (err) {
      lines.push(`${b.dataset.id}: ${err.message}`);
    }
  }
  toast(lines.join('\n') || 'No companies with a URL.', { ms: 10000 });
  $('checkAll').disabled = false;
  await refreshAll().catch(() => {});
});

$('reload').addEventListener('click', () => refreshAll().catch((e) => toast(e.message, { bad: true })));

// ---------- Notifications ----------
let seenKeys = null; // null until the first load, so old announcements do not trigger alerts
const keyOfChange = (c) => `${c.companyId}|${c.date}|${c.title}`;

function notifyHigh(items) {
  if (seenKeys === null) {
    seenKeys = new Set(items.map(keyOfChange));
    return;
  }
  const news = items.filter((c) => c.level === 'high' && !seenKeys.has(keyOfChange(c)));
  items.forEach((c) => seenKeys.add(keyOfChange(c)));
  if (!news.length) return;

  const text = news.map((c) => `${c.company}: ${c.title}`).join(' · ');
  toast(`New high-relevance announcement\n${text}`, { hi: true, ms: 10000 });
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Ask the Changelog', { body: text });
  }
}

function notifyState() {
  const btn = $('notifyBtn');
  if (!('Notification' in window)) { btn.hidden = true; return; }
  const p = Notification.permission;
  if (p === 'granted') { btn.textContent = 'Notifications: on'; btn.disabled = true; }
  else if (p === 'denied') { btn.textContent = 'Notifications: blocked'; btn.disabled = true; }
  else { btn.textContent = 'Enable notifications'; btn.disabled = false; }
}

$('notifyBtn').addEventListener('click', async () => {
  await Notification.requestPermission();
  notifyState();
});

// ---------- New announcements ----------
function changeCard(c) {
  return `
    <article class="card ann lv-${esc(c.level || 'none')}">
      <div class="ann-top"><span class="pill-co">${esc(c.company ?? '')}</span>${c.level ? badge(c.level) : ''}</div>
      <div class="meta">${esc(c.date ?? '')} · found ${when(c.at)}</div>
      <h3 class="ann-title">${esc(c.title ?? '')}</h3>
      ${c.summary ? `<p class="ann-text">${esc(c.summary)}</p>` : ''}
      ${c.reasons?.length ? `<div class="chips">${tagsHtml(c.reasons)}</div>` : ''}
      ${c.explanation ? explainHtml({ explanation: c.explanation, relevance: c.relevance, sources: c.sources }) : ''}
      ${c.answers_error ? `<div class="meta">Explanation failed: ${esc(c.answers_error)}</div>` : ''}
      <div class="ann-actions">${sourceLink(c.url)}</div>
    </article>`;
}

async function loadChanges() {
  const list = await api('/api/changes');
  notifyHigh(list);
  const sorted = [...list].sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
  $('changes').innerHTML = sorted.length
    ? `<div class="cards">${sorted.map(changeCard).join('')}</div>`
    : emptyBox('No new announcements saved yet.');
}

// ---------- All announcements ----------
let compareItems = [];
let lastTags = [];
const filters = { level: 'all', company: 'all' };

function passes(p) {
  if (filters.company !== 'all' && p.companyId !== filters.company) return false;
  if (filters.level === 'high') return p.level === 'high';
  if (filters.level === 'medium') return p.level === 'high' || p.level === 'medium';
  if (filters.level === 'match') return p.level !== 'none';
  return true;
}

function renderFilters() {
  const levels = [['all', 'All'], ['high', 'High only'], ['medium', 'Medium and up'], ['match', 'Any match']];
  $('levelFilters').innerHTML = levels.map(([v, label]) =>
    `<button class="pill${filters.level === v ? ' on' : ''}" data-level="${v}">${label}</button>`).join('');

  const names = new Map();
  for (const p of compareItems) if (!names.has(p.companyId)) names.set(p.companyId, p.company);
  if (filters.company !== 'all' && !names.has(filters.company)) filters.company = 'all';
  $('companyFilters').innerHTML = [['all', 'All companies'], ...names].map(([v, label]) =>
    `<button class="pill${filters.company === v ? ' on' : ''}" data-company="${esc(v)}">${esc(label)}</button>`).join('');
}

$('levelFilters').addEventListener('click', (e) => {
  const b = e.target.closest('[data-level]');
  if (!b) return;
  filters.level = b.dataset.level;
  renderFilters();
  drawCompare();
});

$('companyFilters').addEventListener('click', (e) => {
  const b = e.target.closest('[data-company]');
  if (!b) return;
  filters.company = b.dataset.company;
  renderFilters();
  drawCompare();
});

function compareCard(p, i) {
  return `
    <article class="card ann lv-${esc(p.level)}">
      <div class="ann-top"><span class="pill-co">${esc(p.company)}</span>${badge(p.level)}</div>
      <div class="meta">${esc(p.date ?? '')}</div>
      <h3 class="ann-title">${esc(p.title)}</h3>
      ${p.summary ? `<p class="ann-text">${esc(p.summary)}</p>` : ''}
      <div class="chips">${p.matched.length ? tagsHtml(p.matched) : '<span class="meta">No keyword matches</span>'}</div>
      <div class="ann-actions"><button data-explain="${i}" data-box="ex-${i}">Explain</button>${sourceLink(p.url)}</div>
      <div id="ex-${i}"></div>
    </article>`;
}

function drawCompare() {
  if (!lastTags.length) {
    $('compare').innerHTML = emptyBox('Without keywords there is no scoring.');
    return;
  }
  if (!compareItems.length) {
    $('compare').innerHTML = emptyBox('No announcements yet. Check a company first.');
    return;
  }
  // Keep the original index so "Explain" finds the right announcement after filtering.
  const shown = compareItems.map((p, i) => ({ p, i })).filter(({ p }) => passes(p));
  $('compare').innerHTML = shown.length
    ? `<div class="cards">${shown.map(({ p, i }) => compareCard(p, i)).join('')}</div>`
    : emptyBox('No results for these filters.');
}

function renderCompare(d) {
  compareItems = d.items;
  lastTags = d.tags;
  renderFilters();
  drawCompare();
}

// The listener is on the document, so it catches "Explain" in the recommendation and in the list.
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-explain]');
  if (!btn) return;
  const i = Number(btn.dataset.explain);
  const p = compareItems[i];
  const box = $(btn.dataset.box);
  btn.disabled = true;
  box.innerHTML = '<div class="explain muted" style="margin-top:8px">Loading explanation...</div>';
  try {
    const a = await post('/api/explain', { title: p.title, date: p.date });
    box.innerHTML = `<div style="margin-top:8px">${explainHtml(a)}</div>`;
  } catch (err) {
    box.innerHTML = `<div class="explain err" style="margin-top:8px">${esc(err.message)}</div>`;
  }
  btn.disabled = false;
});

// ---------- Loading ----------
async function loadCompat() {
  const d = await api('/api/compat');
  renderReco(d);
  renderCompare(d);
}

async function refreshAll() {
  await Promise.all([loadCompanies(), loadChanges(), loadCompat()]);
}

// Highlights the section you are in, in the navigation bar.
const navLinks = [...document.querySelectorAll('.jump a')];
const navObserver = new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (en.isIntersecting) {
      navLinks.forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id));
    }
  }
}, { rootMargin: '-40% 0px -55% 0px' });
document.querySelectorAll('[id^="sec-"]').forEach((h) => navObserver.observe(h));

(async () => {
  notifyState();
  try {
    await loadProfile();
    await refreshAll();
  } catch (e) {
    toast(e.message, { bad: true });
  }
})();

// Every 30 seconds: fresh announcements and company status.
// The recommendation and the list are not refreshed here, so open "Explain" boxes stay open.
setInterval(() => {
  loadChanges().catch(() => {});
  loadCompanies().catch(() => {});
}, 30000);
</script>
</body>
</html>
